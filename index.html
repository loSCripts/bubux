function toggleSettingsPopover(){
  const popover=document.getElementById('settings-popover');
  popover.classList.contains('hidden') ? openSettingsPopover() : closeSettingsPopover();
}
function openSettingsPopover(){ document.getElementById('settings-popover').classList.remove('hidden'); document.getElementById('settings-nav-btn').classList.add('active'); }
function closeSettingsPopover(){ document.getElementById('settings-popover').classList.add('hidden'); document.getElementById('settings-nav-btn').classList.remove('active'); }

function openLoginModal(){
  const p=STATE.profile;
  if(!STATE._tempColor) STATE._tempColor=(p && p.color) || PROFILE_COLORS[0];
  openModal(`
    <div class="onboarding-icon"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
    <h3>${t('localProfile')}</h3>
    <p class="sub">${t('localProfileDesc')}</p>
    <div class="modal-field"><label>${t('displayName')}</label><input id="profile-name-input" type="text" maxlength="24" placeholder="${t('yourName')}" value="${p?escapeHtml(p.name):''}"></div>
    <div class="modal-field"><label>${t('color')}</label><div class="color-swatches">
      ${PROFILE_COLORS.map(c=>`<button class="color-swatch ${STATE._tempColor===c?'selected':''}" style="background:${c}" data-action="pick-color" data-color="${c}"></button>`).join('')}
    </div></div>
    <div class="modal-actions"><button class="btn-secondary" data-action="close-modal">${t('cancel')}</button><button class="btn-primary" data-action="save-profile">${t('save')}</button></div>`);
}
function pickColor(c){ STATE._tempColor=c; document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('selected', s.dataset.color===c)); }
function saveProfileFromModal(){
  const name=document.getElementById('profile-name-input')?.value.trim();
  if(!name){ showToast(t('enterNameFirst')); return; }
  STATE.profile={name, color:STATE._tempColor||PROFILE_COLORS[0]};
  delete STATE._tempColor;
  saveState(); closeModal(); showToast(t('profileSaved'));
}
function openSettingsPanel(){
  const masked=(STATE.auth && STATE.auth.key)?maskKey(STATE.auth.key):t('notSet');
  const LANG_NAMES={en:'English',fr:'Français'};
  openModal(`<h3>${t('settings')}</h3>
    <div class="modal-field"><label>${t('language')}</label>
      <select id="language-select">${SUPPORTED_LANGS.map(l=>`<option value="${l}" ${CURRENT_LANG===l?'selected':''}>${LANG_NAMES[l]||l}</option>`).join('')}</select>
    </div>
    <div class="modal-field"><label>${t('regionLabel')}</label>
      <select id="region-select">${['US','FR','GB','CA','DE','ES','IT'].map(r=>`<option value="${r}" ${STATE.region===r?'selected':''}>${r}</option>`).join('')}</select>
    </div>
    <div class="install-banner"><svg viewBox="0 0 24 24" style="flex:none"><path d="M12 3v13m0 0 4-4m-4 4-4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <div class="txt"><strong>${t('installLuma')}</strong><span>${t('installDesc')}</span></div>
      <button class="btn-primary" style="flex:none;padding:10px 16px" data-action="install-pwa">${t('install')}</button></div>
    <button class="btn-ghost" data-action="reset-app-data" style="width:100%;text-align:center;color:var(--danger)">${t('resetData')}</button>
    <p class="credits-text">${t('tmdbCredit')}<br>${t('justwatchCredit')}</p>`);
  document.getElementById('region-select').addEventListener('change', e=>setRegion(e.target.value));
  document.getElementById('language-select').addEventListener('change', e=>setLanguage(e.target.value));
}
function setRegion(v){ STATE.region=v; saveState(); showToast(t('regionSet',v)); }
function setLanguage(v){
  if(!SUPPORTED_LANGS.includes(v)) return;
  CURRENT_LANG=v; STATE.language=v; saveState();
  CACHE.genresMovie=null; CACHE.genresTV=null;
  heroState.logoCache={}; shortsVideoCache={};
  applyStaticTranslations();
  closeModal();
  router();
}
function confirmResetData(){
  openModal(`<h3>${t('resetConfirmTitle')}</h3><p class="sub">${t('resetConfirmDesc')}</p>
    <div class="modal-actions"><button class="btn-secondary" data-action="close-modal">${t('cancel')}</button><button class="btn-primary" style="background:var(--danger)" data-action="confirm-reset-data">${t('reset')}</button></div>`);
}
function doResetData(){ STATE=defaultState(); CURRENT_LANG=detectLang(); saveState(); closeModal(); showToast(t('dataReset')); goHashOrRefresh('#/home'); }

/* ================= PWA ================= */
function buildManifest(){
  return {
    name:"Bubux — Movie & TV Discovery", short_name:"Bubux",
    description:"Discover movies & shows, track what to watch, find where to stream.",
    start_url:".", scope:".", display:"standalone", orientation:"portrait",
    background_color:"#050506", theme_color:"#0a0a0e",
    icons:[
      {src:ICON_192, sizes:"192x192", type:"image/png", purpose:"any"},
      {src:ICON_192, sizes:"192x192", type:"image/png", purpose:"maskable"},
      {src:ICON_512, sizes:"512x512", type:"image/png", purpose:"any"},
      {src:ICON_512, sizes:"512x512", type:"image/png", purpose:"maskable"}
    ]
  };
}
function injectManifest(){
  try{
    const json=JSON.stringify(buildManifest());
    const b64=btoa(unescape(encodeURIComponent(json)));
    if(location.protocol!=='http:' && location.protocol!=='https:') document.getElementById('manifest-link').setAttribute('href','data:application/json;base64,'+b64);
    document.getElementById('favicon-link').setAttribute('href', ICON_192);
    document.getElementById('touch-icon-link').setAttribute('href', ICON_192);
  }catch(e){ console.error(e); }
}
const SW_SOURCE=`
const CACHE_NAME='luma-shell-v1';
self.addEventListener('install', e=>{ self.skipWaiting(); });
self.addEventListener('activate', e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e=>{
  if(e.request.method!=='GET') return;
  const url=e.request.url;
  const isTMDB = url.indexOf('api.themoviedb.org')>-1 || url.indexOf('image.tmdb.org')>-1;
  e.respondWith(
    caches.open(CACHE_NAME).then(async cache=>{
      if(isTMDB){
        try{ const res=await fetch(e.request); cache.put(e.request, res.clone()); return res; }
        catch(err){ const cached=await cache.match(e.request); if(cached) return cached; throw err; }
      }
      const cached=await cache.match(e.request);
      if(cached) return cached;
      try{ const res=await fetch(e.request); cache.put(e.request, res.clone()); return res; }
      catch(err){ throw err; }
    })
  );
});
`;
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  try{
    if(location.protocol!=='http:' && location.protocol!=='https:') return;
    navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(()=>{});
  }catch(e){}
}
let deferredInstallPrompt=null;
const INSTALL_SNOOZE_KEY='bubux_install_snooze';
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function showInstallFloat(){
  try{
    if(!deferredInstallPrompt || isStandalone() || document.getElementById('install-float')) return;
    const until=parseInt(safeStorageGet(INSTALL_SNOOZE_KEY)||'0',10);
    if(until && Date.now()<until) return;
    const fr=(CURRENT_LANG==='fr');
    const el=document.createElement('div'); el.id='install-float';
    el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + var(--safe-b));z-index:55;width:min(92vw,460px);';
    el.innerHTML='<div class="install-banner" style="margin:0;background:var(--bg-elevated-2);box-shadow:var(--shadow-pop)">'
      +'<img src="icon-192.png" alt="" style="width:40px;height:40px;flex:none" onerror="this.style.display=\'none\'">'
      +'<div class="txt"><strong>'+t('installLuma')+'</strong><span>'+t('installDesc')+'</span></div>'
      +'<button class="btn-primary" style="flex:none;padding:10px 16px" data-action="install-pwa">'+t('install')+'</button>'
      +'<button data-action="dismiss-install-float" aria-label="'+(fr?'Plus tard':'Later')+'" style="flex:none;padding:6px"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>';
    document.body.appendChild(el);
  }catch(e){}
}
function hideInstallFloat(snoozeDays){
  const el=document.getElementById('install-float'); if(el) el.remove();
  if(snoozeDays) safeStorageSet(INSTALL_SNOOZE_KEY, String(Date.now()+snoozeDays*86400000));
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstallPrompt=e; maybeShowInstallBanner(); setTimeout(showInstallFloat,2500); });
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt=null; hideInstallFloat(); showToast(t('lumaInstalled')); });
async function triggerInstall(){
  if(!deferredInstallPrompt){ showToast(t('noInstallPrompt')); return; }
  hideInstallFloat();
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  showToast(choice.outcome==='accepted' ? t('installing') : t('installDismissed'));
}

/* ================= SCROLL (parallax / hue-rotate / scroll-top / infinite scroll) ================= */
let scrollTicking=false;
function onScrollThrottled(){ if(!scrollTicking){ requestAnimationFrame(()=>{ onScroll(); scrollTicking=false; }); scrollTicking=true; } }
function scrollRoot(){ const de=document.documentElement; return de.scrollHeight>de.clientHeight+1?de:document.body; }
function onScroll(){
  try{
    const sr=scrollRoot();
    const y=Math.max(window.scrollY||0, sr.scrollTop||0);
    const aurora=document.getElementById('aurora-bg');
    if(aurora && aurora.classList.contains('active')){
      aurora.style.transform=`translateY(${y*-0.25}px)`;
      aurora.style.filter=`hue-rotate(${(y*0.04)%360}deg)`;
    }
    const heroWrap=document.getElementById('hero-bg-wrap');
    if(heroWrap){ heroWrap.style.transform=`translateY(${y*0.4}px)`; }
    const stt=document.getElementById('scroll-top-btn');
    if(stt) stt.classList.toggle('show', y>300);
    if(window.__infiniteScrollHandler){
      if(sr.scrollHeight-(y+sr.clientHeight) < 2500){ window.__infiniteScrollHandler(); }
    }
  }catch(e){ console.error('onScroll error:', e); }
}

/* ================= LONG PRESS (add to list from a card) ================= */
let lpTimer=null, lpFired=false;
document.addEventListener('pointerdown', e=>{
  const card=e.target.closest('[data-longpress]');
  if(!card) return;
  lpFired=false;
  lpTimer=setTimeout(()=>{ lpFired=true; openAddToListModal(card.dataset.lpType, card.dataset.lpId); if(navigator.vibrate) navigator.vibrate(15); }, 500);
});
['pointerup','pointerleave','pointercancel','pointermove'].forEach(evt=>document.addEventListener(evt, ()=>clearTimeout(lpTimer)));

/* ================= BROKEN IMAGE HANDLING ================= */
document.addEventListener('error', function(e){
  if(e.target && e.target.tagName==='IMG'){ e.target.style.visibility='hidden'; }
}, true);

/* ================= GLOBAL CLICK DELEGATION ================= */
function handleGlobalClick(e){
  const popover=document.getElementById('settings-popover');
  const gearBtn=document.getElementById('settings-nav-btn');
  if(!popover.classList.contains('hidden') && !popover.contains(e.target) && e.target!==gearBtn && !gearBtn.contains(e.target)){ closeSettingsPopover(); }
  const pd=document.getElementById('provider-dropdown-list');
  if(pd && !pd.classList.contains('hidden') && !pd.contains(e.target) && !e.target.closest('#provider-row-title')){ pd.classList.add('hidden'); }
  if(e.target.classList.contains('modal-backdrop')){ closeModal(); return; }
  if(lpFired){ lpFired=false; return; }

  const el=e.target.closest('[data-action]');
  if(!el) return;
  const action=el.dataset.action, d=el.dataset;
  switch(action){
    case 'navigate': location.hash=d.href; break;
    case 'go-back': goBack(); break;
    case 'play-trailer': heroPause(); playTrailer(d.type,d.id); break;
    case 'edit-tastes': openTasteQuiz(); break;
    case 'close-modal-x': closeModal(); break;
    case 'taste-save': tasteSave(); break;
    case 'taste-genre': { const id=Number(d.v); if(tasteDraft){ if(tasteDraft.genres.has(id)) tasteDraft.genres.delete(id); else tasteDraft.genres.add(id); el.classList.toggle('on'); } break; }
    case 'taste-type': case 'taste-era': { if(tasteDraft){ if(action==='taste-type') tasteDraft.type=d.v; else tasteDraft.era=d.v; el.parentElement.querySelectorAll('.taste-chip').forEach(b=>b.classList.toggle('on',b===el)); } break; }
    case 'watch':
      heroPause();
      videasyCurrentImage=d.image||'';
      openVideasyPlayer(d.type,d.id,d.title,d.season?Number(d.season):null,d.episode?Number(d.episode):null);
      break;
    case 'videasy-pick-episode': videasySwitchEpisode(Number(d.season),Number(d.episode)); break;
    case 'toggle-short-mute': toggleShortsMute(el); break;
    case 'add-to-list': openAddToListModal(d.type,d.id); break;
    case 'toggle-list-item': toggleListItem(d.list,d.type,d.id); break;
    case 'new-list': openNewListModal(); break;
    case 'new-list-inline': openNewListInline(d.type,d.id); break;
    case 'confirm-new-list': confirmNewList(); break;
    case 'confirm-new-list-inline': confirmNewListInline(d.type,d.id); break;
    case 'delete-list': confirmDeleteList(d.id); break;
    case 'confirm-delete-list': doDeleteList(d.id); break;
    case 'toggle-cw-edit':
      document.getElementById('cw-row')?.classList.toggle('editing');
      document.querySelectorAll('#cw-row .card-remove').forEach(b=>b.classList.toggle('hidden'));
      break;
    case 'remove-cw': removeContinueWatching(d.type,d.id); break;
    case 'change-recs-ref': openChangeRecsRef(); break;
    case 'set-recs-ref': recsRefOverride={id:d.id,type:d.type,title:d.title}; closeModal(); renderBecauseYouWatched(); break;
    case 'toggle-provider-dropdown': pd?.classList.toggle('hidden'); break;
    case 'select-provider': selectProvider(d.id); break;
    case 'open-filter': openFilterSheet(d.filter); break;
    case 'apply-filter': applyFilterValue(d.kind,d.value,d.label); break;
    case 'surprise-me': surpriseMe(d.media); break;
    case 'toggle-settings-popover': toggleSettingsPopover(); break;
    case 'open-login': closeSettingsPopover(); openLoginModal(); break;
    case 'open-login-key': closeModal(); showApiKeyOnboarding(); break;
    case 'open-settings': closeSettingsPopover(); openSettingsPanel(); break;
    case 'open-shorts': closeSettingsPopover(); location.hash='#/shorts'; break;
    case 'close-modal': closeModal(); break;
    case 'save-api-key': saveApiKeyFromModal(); break;
    case 'clear-api-key': clearApiKey(); break;
    case 'save-profile': saveProfileFromModal(); break;
    case 'pick-color': pickColor(d.color); break;
    case 'install-pwa': triggerInstall(); break;
    case 'dismiss-install-float': hideInstallFloat(3); break;
    case 'open-ad-link': openExternalTab(AD_LINK); break;
    case 'dismiss-install-banner': STATE._installDismissed=true; maybeShowInstallBanner(); break;
    case 'reset-app-data': confirmResetData(); break;
    case 'confirm-reset-data': doResetData(); break;
    case 'open-api-key-help': window.open('https://www.themoviedb.org/settings/api','_blank'); break;
  }
}
document.addEventListener('click', handleGlobalClick);

/* ================= INIT ================= */
function applyStaticTranslations(){
  const map={'i18n-login-label':'login','i18n-settings-label':'settings','i18n-shorts-label':'shorts'};
  Object.keys(map).forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=t(map[id]); });
  document.documentElement.lang=CURRENT_LANG;
}
async function init(){
  CURRENT_LANG = (STATE.language && SUPPORTED_LANGS.includes(STATE.language)) ? STATE.language : detectLang();
  if(!STATE.language){
    STATE.language=CURRENT_LANG;
    if(CURRENT_LANG==='fr' && STATE.region==='US') STATE.region='FR';
    saveState();
  }
  applyStaticTranslations();
  injectManifest();
  registerServiceWorker();
  document.getElementById('scroll-top-btn').addEventListener('click', ()=>{ window.scrollTo({top:0,behavior:'smooth'}); try{ document.body.scrollTo({top:0,behavior:'smooth'}); }catch(e){} });
  window.addEventListener('hashchange', router);
  window.addEventListener('hashchange',()=>{ setTimeout(()=>{ if(!document.getElementById('home-hero')) heroTeardown(); },400); });
  window.addEventListener('scroll', onScrollThrottled, {passive:true});
  document.addEventListener('scroll', onScrollThrottled, {passive:true, capture:true}); // le body est le conteneur qui defile
  if(true){ try{ await Promise.all([ensureGenres('movie'),ensureGenres('tv')]); }catch(e){} }
  await router();
}
document.addEventListener('DOMContentLoaded', init);
</script>
