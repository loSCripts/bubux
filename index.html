  background:var(--bg-void); color:var(--text-1); font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent; overflow-x:hidden; min-height:100vh;
  -webkit-font-smoothing:antialiased; position:relative;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
::selection{background:var(--accent-1);color:#fff}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}

/* ============ AURORA ANIMATED BACKGROUND ============ */
#aurora-bg{
  position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--aurora-1);
  opacity:0; transition:opacity .5s ease; pointer-events:none;
  will-change:transform,filter;
}
#aurora-bg.active{opacity:1}
#aurora-bg .blob{position:absolute;border-radius:50%;filter:blur(50px);mix-blend-mode:screen;will-change:transform}
.blob-1{width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,var(--aurora-4),transparent 70%);animation:drift1 26s ease-in-out infinite;opacity:.8}
.blob-2{width:56vmax;height:56vmax;right:-14vmax;top:-6vmax;background:radial-gradient(circle,var(--aurora-5),transparent 70%);animation:drift2 31s ease-in-out infinite;opacity:.75}
.blob-3{width:68vmax;height:68vmax;left:-14vmax;bottom:-28vmax;background:radial-gradient(circle,var(--aurora-3),transparent 70%);animation:drift3 27s ease-in-out infinite;opacity:.7}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,10%) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14%,8%) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(10%,-12%) scale(1)}}

/* ============ LAYOUT / VIEW ROOT ============ */
#app{position:relative;z-index:1;min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden}
.view-root{min-height:100vh;padding-bottom:calc(var(--nav-h) + 110px + var(--safe-b));width:100%;max-width:100vw;overflow-x:hidden}
.page{animation:fadeUp .35s ease both;width:100%;max-width:100vw;position:relative}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.top-logo{
  position:absolute; top:calc(18px + var(--safe-t)); left:18px; z-index:5;
  font-family:var(--font-display); font-weight:700; font-size:2rem; color:var(--accent-1);
  text-shadow:0 1px 3px rgba(0,0,0,.6), 0 2px 16px rgba(0,0,0,.55); letter-spacing:-.02em; line-height:1;
  -webkit-text-stroke:.4px rgba(0,0,0,.25);
}
.back-btn{
  position:absolute; top:calc(16px + var(--safe-t)); left:14px; z-index:6;
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);
}
.page-header{padding:calc(64px + var(--safe-t)) 20px 4px}
.page-header h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,7vw,2.15rem);letter-spacing:-.01em}
.page-header p{color:var(--text-2);margin-top:6px;font-size:.92rem}

/* ============ HERO (home rotator + detail page) ============ */
.hero{position:relative;width:100%;min-height:78vh;overflow:hidden;background:var(--bg-elevated)}
.hero-bg-wrap{position:absolute;inset:0;overflow:hidden}
.hero-bg{position:absolute;inset:-4% -4% -4% -4%;background-size:cover;background-position:center;animation:kenburns 20s ease-in-out infinite alternate;transition:background-image .6s ease}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero-scrim{position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%, rgba(10,10,14,.55) 58%, var(--bg-base) 96%);
}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;min-height:78vh;padding:20px 20px 28px}
.hero-logo-img{max-width:78%;max-height:120px;object-fit:contain;object-position:left;margin-bottom:14px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5))}
.hero-title-fallback{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,10vw,3.4rem);line-height:1;margin-bottom:14px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.hero-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--text-1);font-size:.85rem;font-weight:500;margin-bottom:12px}
.hero-meta span{display:flex;align-items:center;gap:6px}
.hero-meta svg{width:16px;height:16px}
.hero-meta .star-ic{fill:var(--star);stroke:var(--star)}
.hero-desc{color:var(--text-2);font-size:.92rem;line-height:1.45;max-width:640px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:18px}
.hero-actions{display:flex;align-items:center;gap:12px}
.btn-play{
  display:flex;align-items:center;gap:8px;background:var(--text-1);color:var(--bg-void);
  padding:15px 30px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:700;
  font-size:.92rem;text-transform:uppercase;letter-spacing:.04em;box-shadow:var(--shadow-soft);
  transition:transform .15s ease;
}
.btn-play:active{transform:scale(.96)}
.btn-play svg{width:16px;height:16px;fill:var(--bg-void);stroke:none}
.btn-trailer{
  display:flex;align-items:center;gap:8px;background:var(--glass-bg);backdrop-filter:blur(24px);
  color:var(--text-1);padding:15px 26px;border-radius:var(--r-pill);font-family:var(--font-display);
  font-weight:600;font-size:.88rem;border:1px solid var(--glass-border);transition:transform .15s ease;
}
.btn-trailer:active{transform:scale(.96)}
.btn-trailer svg{width:16px;height:16px;fill:none;stroke:var(--text-1);stroke-width:2}
/* --- MODAL LECTEUR VIDEASY (mode cinéma plein écran) --- */
.videasy-modal{
  position:fixed;top:0;left:0;width:100%;height:100%;background:#000;
  z-index:9999;display:flex;flex-direction:column;
}
.videasy-header{
  position:absolute;top:0;left:0;right:0;z-index:3;
  padding:calc(12px + var(--safe-t)) 16px 32px 16px;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
}
.videasy-header h3{margin:0;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1rem;
  max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.videasy-close{
  background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;flex:none;
  border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center;
}
.videasy-container{flex:1;position:relative;width:100%;height:100%;background:#000}
.videasy-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.videasy-unavailable{
  position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:32px;text-align:center;background:#000;
}
.videasy-unavailable svg{width:44px;height:44px;stroke:var(--text-2);fill:none;stroke-width:1.6}
.videasy-unavailable p{color:var(--text-1);font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.videasy-unavailable span{color:var(--text-2);font-size:.88rem;max-width:280px}
.videasy-unavailable button{
  margin-top:6px;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-1);
  padding:12px 24px;border-radius:var(--r-pill);font-weight:600;font-size:.88rem;
}
.videasy-rotate-hint{
  display:none;position:absolute;left:0;right:0;bottom:calc(14px + var(--safe-b));z-index:2;
  text-align:center;color:rgba(255,255,255,.5);font-family:var(--font-display);
  font-size:.76rem;pointer-events:none;
}
@media (orientation: portrait){
  .videasy-rotate-hint{display:block}
}
/* --- Panneau Épisodes (façon Netflix), séparé du lecteur --- */
#videasy-episodes-toggle{font-size:.85rem;width:auto;padding:0 14px;border-radius:var(--r-pill);gap:6px}
.videasy-episodes-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:62%;
  background:rgba(14,14,16,.97);backdrop-filter:blur(16px);
  border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .28s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
.videasy-episodes-panel.open{transform:translateY(0)}
.videasy-episodes-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none}
.videasy-episodes-head h4{margin:0;color:#fff;font-family:var(--font-display);font-weight:700;font-size:.95rem}
.videasy-season-select{
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:7px 10px;font-size:.82rem;font-family:var(--font-body);
}
.videasy-episodes-list{overflow-y:auto;padding:0 12px 16px;flex:1}
.videasy-episode-row{
  display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px;cursor:pointer;
}
.videasy-episode-row.current{background:rgba(255,255,255,.08)}
.videasy-episode-row .ep-thumb{
  flex:none;width:100px;height:58px;border-radius:8px;background:#1c1c1e no-repeat center/cover;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.videasy-episode-row.current .ep-thumb::after{
  content:'▶';color:#fff;font-size:1rem;background:rgba(0,0,0,.4);width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;position:absolute;inset:0;border-radius:8px;
}
.videasy-episode-row .ep-num{color:var(--text-2,#999);font-size:.72rem;font-weight:600}
.videasy-episode-row .ep-title{color:#fff;font-size:.85rem;font-weight:600;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.videasy-next-episode-bar{
  position:absolute;right:16px;bottom:calc(20px + var(--safe-b));z-index:4;
  background:rgba(20,20,22,.92);border:1px solid rgba(255,255,255,.14);color:#fff;
  padding:10px 16px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:600;
  font-size:.82rem;display:none;align-items:center;gap:8px;backdrop-filter:blur(10px);
}
.videasy-next-episode-bar.show{display:flex}
.videasy-next-episode-bar svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.btn-segment{display:flex;align-items:stretch;background:var(--glass-bg);backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--r-pill);overflow:hidden}
.btn-segment button{padding:15px 20px;display:flex;align-items:center;justify-content:center}
.btn-segment .seg-divider{width:1px;background:rgba(255,255,255,.2);margin:10px 0}
.taste-label{font-weight:700;font-size:.82rem;color:var(--text-2);margin:16px 0 8px}
.taste-chips{display:flex;flex-wrap:wrap;gap:8px}
.taste-chip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:var(--text-1);font-size:.85rem;font-weight:500;cursor:pointer}
.taste-chip.on{background:var(--accent-grad);border-color:transparent;color:#fff;font-weight:700}
.hero-video{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .8s ease;pointer-events:none;z-index:0}
.hero-video.on{opacity:1}
.hero-video iframe,.hero-video>div{position:absolute;top:50%;left:50%;border:0;pointer-events:none!important;transform:translate(-50%,-50%) scale(1.25)}
.hero-dots{position:absolute;top:calc(64px + var(--safe-t));left:0;right:0;z-index:3;display:flex;gap:5px;justify-content:center;padding:0 20px}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:all .3s ease}
.hero-dots span.active{background:#fff;width:16px;border-radius:4px}

/* ============ SECTIONS / ROWS ============ */
.section{margin:26px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px}
.section-head h2{font-family:var(--font-display);font-weight:700;font-size:1.22rem}
.section-head .view-all{display:flex;align-items:center;gap:4px;color:var(--text-2);font-size:.85rem;font-weight:500}
.section-head .view-all svg{width:14px;height:14px}
.section-head .with-dropdown{display:flex;align-items:center;gap:6px;cursor:pointer}
.section-head .with-dropdown u{text-decoration:underline;text-underline-offset:3px}
.section-head .edit-pencil{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.section-head .edit-pencil svg{width:18px;height:18px}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.row-scroll::-webkit-scrollbar{display:none}

/* ============ CARDS ============ */
.card{flex:0 0 auto;width:150px;min-width:0;position:relative}
.card.wide{width:230px}
.card-media{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--r-card);overflow:hidden;
  background:var(--bg-elevated);box-shadow:var(--shadow-soft)}
.card.wide .card-media{aspect-ratio:16/9}
.card-media img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  padding:3px 8px;border-radius:var(--r-sm);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card-remove{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center}
.card-remove svg{width:14px;height:14px}
.card-title{margin-top:8px;font-size:.92rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;gap:5px;color:var(--text-2);font-size:.78rem;margin-top:2px;min-width:0}
.card-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.card-meta svg{width:12px;height:12px;fill:var(--star);stroke:var(--star)}
.card-progress-label{font-size:.78rem;color:var(--text-2);margin-top:2px}

/* grid used on Movies/TV/Search/Lists */
.grid-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 12px;padding:8px 20px 60px;width:100%;max-width:100%}
.grid-2col .card{width:100%;min-width:0}

/* ============ FILTER PILLS ============ */
.filters-row{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px 4px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.08);
  padding:11px 16px;border-radius:var(--r-pill);font-size:.85rem;font-weight:500;color:var(--text-1);white-space:nowrap;
  max-width:62vw;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:14px;height:14px}
.pill.icon-only{padding:11px;width:44px;height:44px;justify-content:center}
.pill .dot-active{width:6px;height:6px;border-radius:50%;background:var(--text-1);margin-right:2px}

/* ============ SEARCH PAGE ============ */
.search-hero{padding:calc(70px + var(--safe-t)) 20px 10px;text-align:left}
.search-hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,8vw,2.5rem);margin-bottom:20px}
.search-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  transition:border-color .2s ease,box-shadow .2s ease;
  border-radius:var(--r-pill);padding:15px 20px}
.search-bar:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(124,58,237,.28)}
.search-bar svg{width:19px;height:19px;color:var(--text-2);flex:none}
.search-bar input{flex:1;color:var(--text-1);font-size:.95rem}
.search-bar input:focus-visible{outline:none}
.search-bar input::placeholder{color:var(--text-3)}
.search-bar .clear-btn{width:20px;height:20px}
.trending-label{text-align:center;color:var(--text-2);font-weight:500;font-size:1.05rem;margin:26px 0 14px}

/* ============ LISTS PAGE ============ */
.lists-header{display:flex;align-items:flex-start;justify-content:space-between;padding:calc(64px + var(--safe-t)) 20px 2px;gap:12px}
.lists-header h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,7vw,2.15rem)}
.btn-gradient{display:flex;align-items:center;gap:6px;background:var(--accent-grad);color:#fff;font-weight:700;
  font-size:.85rem;padding:12px 18px;border-radius:var(--r-pill);white-space:nowrap;box-shadow:var(--shadow-soft)}
.btn-gradient svg{width:16px;height:16px}
.lists-count{color:var(--text-2);font-size:.88rem;padding:6px 20px 0}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 40px;color:var(--text-3)}
.empty-state svg{width:56px;height:56px;margin-bottom:22px;opacity:.5}
.empty-state h3{color:var(--text-1);font-size:1.2rem;font-weight:700;margin-bottom:8px;opacity:.85}
.empty-state p{font-size:.9rem;max-width:280px;line-height:1.4}
.list-card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:var(--r-card);margin:0 20px 12px}
.list-card .thumbs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:56px;height:56px;
  border-radius:10px;overflow:hidden;flex:none;background:var(--bg-elevated)}
.list-card .thumbs img{width:100%;height:100%;object-fit:cover}
.list-card .info{flex:1;min-width:0}
.list-card .info h4{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-card .info p{color:var(--text-2);font-size:.8rem;margin-top:2px}
.lists-grid-wrap{padding-top:14px;padding-bottom:40px}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed; left:50%; bottom:calc(18px + var(--safe-b)); transform:translateX(-50%); z-index:50;
  display:flex; align-items:center; gap:4px; padding:8px; border-radius:var(--r-pill);
  background:var(--glass-bg); backdrop-filter:blur(14px) saturate(140%); border:1px solid var(--glass-border);
  box-shadow:var(--shadow-pop); transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.bottom-nav.nav-hidden{transform:translateX(-50%) translateY(160%)}
.nav-btn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.78); transition:background .25s ease,color .25s ease,transform .2s ease}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{background:rgba(255,255,255,.18);color:#fff}
.nav-btn:active{transform:scale(.9)}

.scroll-top-btn{
  position:fixed; right:18px; bottom:calc(94px + var(--safe-b)); z-index:49; width:46px;height:46px;border-radius:50%;
  background:var(--glass-bg); backdrop-filter:blur(12px); border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px) scale(.8);
  transition:all .3s ease; box-shadow:var(--shadow-soft);
}
.scroll-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}

/* ============ SETTINGS POPOVER ============ */
.settings-popover{
  position:fixed; z-index:60; bottom:calc(90px + var(--safe-b)); right:14px; min-width:190px;
  background:var(--glass-bg-strong); backdrop-filter:blur(14px); border:1px solid var(--glass-border);
  border-radius:var(--r-modal); padding:6px; box-shadow:var(--shadow-pop);
  transform-origin:bottom right; transition:all .22s ease;
}
.settings-popover.hidden{opacity:0;transform:scale(.9) translateY(6px);pointer-events:none}
.popover-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;font-size:.92rem;font-weight:500}
.popover-item:active{background:rgba(255,255,255,.06)}
.popover-divider{height:1px;background:rgba(255,255,255,.08);margin:2px 8px}

/* ============ MODALS ============ */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:480px;background:var(--bg-elevated-2);border:1px solid var(--glass-border);
  border-radius:var(--r-modal) var(--r-modal) 0 0;padding:26px 22px calc(26px + var(--safe-b));max-height:85vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.22,1,.36,1)}
@media (min-width:560px){.modal-backdrop{align-items:center}.modal-card{border-radius:var(--r-modal)}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

.settings-panel-row .value{color:var(--text-2);font-size:.82rem}
.settings-panel-row button.link-btn{color:var(--accent-1);font-weight:500;font-size:.85rem}
.credits-text{font-size:.76rem;color:var(--text-3);line-height:1.5;margin-top:16px}

/* ============ TOASTS ============ */
.toast-container{position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;padding:0 20px}
.toast{background:var(--bg-elevated-2);border:1px solid var(--glass-border);padding:12px 20px;border-radius:var(--r-pill);
  font-size:.85rem;font-weight:500;box-shadow:var(--shadow-pop);opacity:0;transform:translateY(10px);
  transition:all .3s cubic-bezier(.22,1,.36,1);max-width:100%;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}

/* ============ SKELETON LOADERS ============ */
.skel{background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-elevated-2) 50%,var(--bg-elevated) 75%);

@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{aspect-ratio:2/3;width:100%}

/* ============ SHORTS VIEW ============ */
.shorts-wrap{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;touch-action:pan-y}
.short-item{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:flex-end;background:#000}
.short-item .short-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.75;transition:opacity .25s ease}

.short-video-slot{position:absolute;inset:0;z-index:1}
.short-video-slot iframe{position:absolute;top:50%;left:50%;width:100%;height:56.25vw;min-height:100%;min-width:177.78vh;transform:translate(-50%,-50%);border:none;pointer-events:none}
.short-mute-btn{position:absolute;z-index:3;top:calc(18px + var(--safe-t));right:16px;width:42px;height:42px;border-radius:50%;

.short-mute-btn svg{width:20px;height:20px}
.shorts-back-btn{position:fixed;top:calc(18px + var(--safe-t));left:14px;z-index:20}

/* ============ PROVIDER DROPDOWN ============ */
.provider-dropdown{position:absolute;z-index:10;left:20px;right:20px;top:100%;margin-top:6px;
  background:var(--glass-bg-strong);backdrop-filter:blur(12px);border:1px solid var(--glass-border);
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow-pop);max-height:340px;overflow-y:auto}
.provider-dropdown.hidden{display:none}
.provider-item{display:flex;align-items:center;gap:14px;padding:14px 18px}
.provider-item:active{background:rgba(255,255,255,.06)}
.provider-item img{width:32px;height:32px;border-radius:9px;object-fit:cover;background:var(--bg-elevated)}
.provider-item.selected{background:rgba(255,255,255,.07)}

/* ============ DETAIL VIEW EXTRAS ============ */
.detail-section{padding:0 20px;margin:22px 0}
.detail-section h3{font-family:var(--font-display);font-weight:700;font-size:1.1rem;margin-bottom:12px}
.provider-badges{display:flex;gap:10px;flex-wrap:wrap}
.provider-badge{display:flex;align-items:center;gap:8px;background:var(--glass-bg);border:1px solid var(--glass-border);

.provider-badge img{width:24px;height:24px;border-radius:6px}
.provider-badge span{font-size:.82rem;font-weight:500}
.cast-row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.cast-row::-webkit-scrollbar{display:none}
.cast-item{flex:0 0 auto;width:76px;text-align:center}
.cast-item .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--bg-elevated);margin:0 auto 6px}
.cast-item .name{font-size:.72rem;color:var(--text-2);line-height:1.2}
.install-banner{margin:0 20px 20px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--r-card);
  padding:16px;display:flex;align-items:center;gap:14px}
.install-banner .txt{flex:1}
.install-banner .txt strong{display:block;font-size:.92rem;margin-bottom:2px}
.install-banner .txt span{font-size:.78rem;color:var(--text-2)}
.onboarding-icon{width:52px;height:52px;border-radius:16px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.onboarding-icon svg{width:26px;height:26px;stroke:#fff}
.field-hint{font-size:.78rem;color:var(--text-3);margin-top:6px;line-height:1.4}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (min-width:720px){
  /* corrige les cartes des rangées horizontales (elles prenaient 100% de largeur) */
  .row-scroll .card{width:170px;flex:0 0 auto}
  .row-scroll .card.wide{width:270px}
}

/* ============ VERSION ORDINATEUR (>=1024px). Le mobile n'est pas touche ============ */
@media (min-width:1024px){
  :root{--dpad:max(40px,calc((100vw - 1440px)/2 + 40px))}

  /* marges laterales alignees sur une largeur de contenu confortable */

  .lists-count{padding-left:var(--dpad);padding-right:var(--dpad)}

  .install-banner{margin-left:var(--dpad);margin-right:var(--dpad)}

  /* titres */
  .page-header h1,.lists-header h1{font-size:2.6rem}

  .search-hero h1{font-size:3rem}

  /* hero */
  .hero,.hero-content{min-height:72vh}

  .hero-logo-img{max-width:480px;max-height:150px}
  .hero-title-fallback{font-size:4.2rem}

  .hero-desc{font-size:1.02rem;max-width:720px;-webkit-line-clamp:3}
  .btn-play{padding:16px 36px;font-size:.98rem}
  .btn-trailer{padding:16px 30px;font-size:.95rem}

  /* cartes et grilles */
  .row-scroll{gap:18px}
  .row-scroll .card{width:200px}
  .row-scroll .card.wide{width:320px}
  .grid-2col{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px}
  .card-title{font-size:.98rem}
  .card-meta{font-size:.82rem}
  .card-media{transition:transform .25s ease}
  .card:hover .card-media{transform:translateY(-4px)}

  /* filtres, listes */
  .pill{max-width:360px}
  .list-card{max-width:760px}
  .cast-item{width:92px}
  .cast-item .avatar{width:76px;height:76px}
  .cast-item .name{font-size:.8rem}
  .provider-dropdown{left:var(--dpad);right:auto;width:360px}

  /* navigation et boutons flottants */
  .scroll-top-btn{right:32px}
  .settings-popover{right:auto;left:calc(50% + 148px)}

  /* fenetres modales */
  .modal-card{max-width:520px}

  /* lecteur : panneau des episodes en carte a droite plutot qu'en bandeau pleine largeur */
  .videasy-episodes-panel{left:auto;right:24px;bottom:24px;width:440px;max-height:70%;border-radius:18px}

  .videasy-next-episode-bar{right:32px}

  /* shorts : texte limite en largeur */
  .short-item .short-content{max-width:760px;padding-left:var(--dpad)}
}
@media (min-width:1700px){

  .row-scroll .card.wide{width:360px}

}

const TMDB_BASE='https://bubux-tmdb.ilaheydari97.workers.dev';

/* ================= STATE / STORAGE ================= */
const STORAGE_KEY='luma_state';
let memoryFallback={};
function safeStorageGet(key){ try{ return localStorage.getItem(key); }catch(e){ return memoryFallback[key] ?? null; } }
function safeStorageSet(key,value){ try{ localStorage.setItem(key,value); }catch(e){ memoryFallback[key]=value; } }
function defaultState(){ return { auth:null, profile:null, region:'US', language:null, lists:[], continueWatching:[], seenOnboarding:false, selectedProvider:null }; }
function loadState(){
  const raw=safeStorageGet(STORAGE_KEY);
  if(!raw) return defaultState();
  try{ return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){ return defaultState(); }
}
function saveState(){ const copy=Object.assign({},STATE); delete copy._tempColor; delete copy._installDismissed; safeStorageSet(STORAGE_KEY, JSON.stringify(copy)); }
let STATE=loadState();
const CACHE={genresMovie:null,genresTV:null};
async function ensureGenres(mediaType){
  const key=mediaType==='movie'?'genresMovie':'genresTV';
  if(!CACHE[key]){ try{ const data=await TMDBApi.genres(mediaType); CACHE[key]=data.genres||[]; }catch(e){ CACHE[key]=[]; } }
  return CACHE[key];
}
function genreNameFor(mediaType,id){
  const key=mediaType==='movie'?'genresMovie':'genresTV';
  const found=(CACHE[key]||[]).find(g=>g.id===id);
  return found?found.name:null;
}

/* ================= TMDB API ================= */
function buildAuth(url,params){
  const key=(STATE.auth&&STATE.auth.key)||'';
  const isJWT = key.split('.').length===3 && key.length>60;
  const usp=new URLSearchParams(params||{});
  let headers={};
  if(isJWT){ headers['Authorization']='Bearer '+key; } else { usp.set('api_key',key); }
  const qs=usp.toString();
  return {url:url+(qs?'?'+qs:''),headers};
}
async function tmdb(path,params={}){
  const qs=new URLSearchParams(Object.assign({language:LANG_TO_TMDB[CURRENT_LANG]||'en-US'},params)).toString();
  const res=await fetch(TMDB_BASE+path+(qs?'?'+qs:''));
  if(res.status===401){ const err=new Error('INVALID_KEY'); err.code=401; throw err; }
  if(!res.ok){ const err=new Error('TMDB_ERROR'); err.code=res.status; throw err; }
  return res.json();
}
const TMDBApi={
  trending:(mediaType='all',win='day',page=1)=>tmdb(`/trending/${mediaType}/${win}`,{page}),
  popular:(mediaType='movie',page=1)=>tmdb(`/${mediaType}/popular`,{page}),
  discover:(mediaType='movie',params={})=>tmdb(`/discover/${mediaType}`,params),
  searchMulti:(query,page=1)=>tmdb('/search/multi',{query,page,include_adult:false}),
  genres:(mediaType='movie')=>tmdb(`/genre/${mediaType}/list`),
  providersList:(mediaType='movie',region='US')=>tmdb(`/watch/providers/${mediaType}`,{watch_region:region}),
};
function handleApiError(e){
  console.error(e);
  showToast(t('somethingWrongData')+' ['+((e&&(e.code||e.message))||'?')+']');
}

/* ================= TOASTS ================= */
function showToast(msg){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),350); },2400);
}

    </div>

  `);
  setTimeout(()=>document.getElementById('api-key-input')?.focus(),80);

async function saveApiKeyFromModal(){
  const val=document.getElementById('api-key-input')?.value.trim();
  if(!val){ showToast(t('pasteKeyFirst')); return; }
  const btn=document.querySelector('[data-action="save-api-key"]');
  if(btn) btn.textContent=t('checking');
  const prevAuth=STATE.auth;
  STATE.auth={key:val};
  try{
    await tmdb('/authentication');
    STATE.seenOnboarding=true; saveState(); closeModal(); showToast(t('connectedTMDB'));
    await Promise.all([ensureGenres('movie'),ensureGenres('tv')]);
    router();
  }catch(e){
    STATE.auth=prevAuth;
    if(btn) btn.textContent=t('continueBtn');
    showToast(e && e.code===401 ? t('keyRejected') : t('couldNotReach'));
  }
}
function maskKey(k){ return k.length>8 ? k.slice(0,4)+'••••'+k.slice(-4) : '••••••'; }

/* ================= ROUTER ================= */
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  return parts.length?parts:['home'];
}
function updateNavActive(parts){
  const top=parts[0];
  document.querySelectorAll('.nav-btn[data-href]').forEach(btn=>{
    const route=(btn.dataset.href||'').replace(/^#\/?/,'').split('/')[0];
    btn.classList.toggle('active', route===top);
  });
}
function updateAuroraVisibility(route){ document.getElementById('aurora-bg').classList.toggle('active', AURORA_ROUTES.includes(route)); }
function updateNavVisibility(route){
  document.getElementById('bottom-nav').classList.toggle('nav-hidden', route==='shorts');
  document.getElementById('scroll-top-btn').classList.toggle('hidden', route==='shorts');
}

async function router(){
  const parts=parseHash();
  const root=document.getElementById('view-root');
  window.__infiniteScrollHandler=null;
  updateNavActive(parts);
  updateAuroraVisibility(parts[0]);
  updateNavVisibility(parts[0]);
  if(parts[0]!=='shorts' && shortsObserver){ shortsObserver.disconnect(); shortsObserver=null; }
  window.scrollTo({top:0}); document.body.scrollTop=0;
  try{
    if(parts[0]==='home') await renderHome(root);
    else if(parts[0]==='movies') await renderCatalog(root,'movie');
    else if(parts[0]==='tv') await renderCatalog(root,'tv');
    else if(parts[0]==='search') await renderSearch(root);
    else if(parts[0]==='lists' && parts[1]) await renderListDetail(root,parts[1]);
    else if(parts[0]==='lists') await renderLists(root);
    else if(parts[0]==='title' && parts[1] && parts[2]) await renderDetail(root,parts[1],parts[2]);
    else if(parts[0]==='shorts') await renderShorts(root);
    else await renderHome(root);
  }catch(e){ handleViewError(e,root); }
}
function handleViewError(e,root){
  if(e && e.message==='NO_KEY'){ showApiKeyOnboarding(); return; }
  console.error(e);
  root.innerHTML=`<div class="page" style="padding:90px 24px;text-align:center;color:var(--text-2)"><p>${t('somethingWrongPage')}</p></div>`;
  showToast(t('unexpectedError'));
}
function goBack(){ if(history.length>1) history.back(); else location.hash='#/home'; }

function posterCardHtml(item){

/* ================= LIGNES INFINIES + NOUVEAUTES ================= */
function infiniteRow(rowEl,fetchPage,opts){
  opts=opts||{};
  const st={page:0,total:1,loading:false,seen:new Set(),dead:false};
  async function more(n){
    if(st.loading||st.dead||!rowEl.isConnected) return;
    if(st.page>=st.total){ if(!st.seen.size) return; st.page=0; st.seen.clear(); }
    st.loading=true;
    const first=st.page+1, last=Math.min(st.total,st.page+n);
    try{
      const pages=await Promise.all(Array.from({length:last-first+1},(_,i)=>fetchPage(first+i).catch(()=>null)));
      let html='';
      pages.forEach(d=>{
        if(!d) return;
        st.total=Math.min(d.total_pages||1,500);
        (d.results||[]).forEach(it=>{
          if(opts.filter && !opts.filter(it)) return;
          const k=(it.media_type||(it.title?'movie':'tv'))+it.id;
          if(st.seen.has(k)) return; st.seen.add(k);
          html+=posterCardHtml(it);
        });
      });
      st.page=last;
      if(st.page===last && !st.seen.size && rowEl.querySelector('.skel')) rowEl.innerHTML=emptyRowMsg();
      else{
        if(rowEl.querySelector('.skel')) rowEl.innerHTML='';
        rowEl.insertAdjacentHTML('beforeend',html);
      }
    }catch(e){ if(!st.seen.size) rowEl.innerHTML=emptyRowMsg(); }
    st.loading=false;
    if(rowEl.isConnected && (st.fill=(st.fill||0)+1)<8 && rowEl.scrollWidth<=rowEl.clientWidth+400) more(2);
  }
  rowEl.addEventListener('scroll',()=>{
    if(rowEl.scrollWidth-(rowEl.scrollLeft+rowEl.clientWidth)<900) more(2);
  },{passive:true});
  more(3);
  return st;
}
function isoDay(offsetDays){ const d=new Date(Date.now()+offsetDays*864e5); return d.toISOString().slice(0,10); }

function tasteGenreIds(mediaType){

function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function fetchLatestHeroItems(){
  const today=isoDay(0), mFrom=isoDay(-75), tFrom=isoDay(-90), type=tasteType();
  const reqs=[];
  if(type!=='tv') [1,2].forEach(pg=>reqs.push(TMDBApi.discover('movie',{sort_by:'popularity.desc','primary_release_date.gte':mFrom,'primary_release_date.lte':today,'vote_count.gte':1,include_adult:false,with_release_type:'2|3',region:STATE.region||'FR',page:pg}).then(r=>(r.results||[]).map(x=>Object.assign({media_type:'movie'},x))).catch(()=>[])));
  if(type!=='movie') [1,2].forEach(pg=>reqs.push(TMDBApi.discover('tv',{sort_by:'popularity.desc','first_air_date.gte':tFrom,'first_air_date.lte':today,include_adult:false,page:pg}).then(r=>(r.results||[]).map(x=>Object.assign({media_type:'tv'},x))).catch(()=>[])));
  let list=(await Promise.all(reqs)).flat().filter(it=>it.backdrop_path);
  const seen=new Set(); list=list.filter(it=>{ const k=it.media_type+it.id; if(seen.has(k)) return false; seen.add(k); return true; });
  list=shuffleArr(list);
  if(STATE.tastes&&STATE.tastes.genres&&STATE.tastes.genres.length){
    const score=it=>{ const ids=tasteGenreIds(it.media_type); return (it.genre_ids||[]).filter(g=>ids.includes(g)).length; };
    list.sort((a,b)=>score(b)-score(a));
  }
  const lang=(LANG_TO_TMDB[CURRENT_LANG]||'en-US').slice(0,2);
  const withKeys=await Promise.all(list.slice(0,24).map(async it=>{
    try{
      const d=await tmdb(`/${it.media_type}/${it.id}/videos`,{include_video_language:`${lang},en,null`});
      const v=(d.results||[]).filter(x=>x.site==='YouTube');
      const pick=v.find(x=>x.type==='Trailer'&&x.official)||v.find(x=>x.type==='Trailer')||v.find(x=>x.type==='Teaser');
      if(pick) it._ytKey=pick.key;
    }catch(e){}
    return it;
  }));
  const ok=withKeys.filter(it=>it._ytKey);
  return (ok.length?ok:withKeys).slice(0,12);
}

/* Lecteur YouTube du hero : sans controles, non interactif, 5 s par film */
const HERO_SLIDE_MS=5000, HERO_START=6;
let heroYT={player:null,ready:false,unlocked:false,paused:false,offscreen:false,apiPromise:null,slideTimer:null,failTimer:null,io:null};
function loadYTApi(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(heroYT.apiPromise) return heroYT.apiPromise;
  heroYT.apiPromise=new Promise(res=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ if(prev) try{prev();}catch(e){} res(); };
    const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
  });
  return heroYT.apiPromise;
}
function heroFitVideo(){
  const hero=document.getElementById('home-hero'), box=document.getElementById('hero-video');
  if(!hero||!box) return;
  const el=box.firstElementChild; if(!el) return;
  const W=hero.clientWidth, H=hero.clientHeight;
  const w=Math.max(W,H*16/9), h=w*9/16;
  el.style.width=w+'px'; el.style.height=h+'px';
}
function heroActive(){ return !heroYT.paused && !heroYT.offscreen && !document.hidden && !!document.getElementById('home-hero'); }
function heroClearTimers(){ clearTimeout(heroYT.slideTimer); clearTimeout(heroYT.failTimer); clearTimeout(heroState.imgTimer); }
function heroDestroyPlayer(){
  heroClearTimers();
  try{ if(heroYT.player && heroYT.player.destroy) heroYT.player.destroy(); }catch(e){}
  heroYT.player=null; heroYT.ready=false;
}
function heroStopPlayback(){ heroClearTimers(); try{ heroYT.player&&heroYT.player.pauseVideo&&heroYT.player.pauseVideo(); }catch(e){} }
function heroPause(){ heroYT.paused=true; heroStopPlayback(); }
function heroResume(){ heroYT.paused=false; heroKick(); }
function heroArmImg(token){
  if(heroState.items.length<2) return;
  clearTimeout(heroState.imgTimer);
  heroState.imgTimer=setTimeout(()=>{ if(token===heroState.token && heroActive()) heroNextSlide(); },HERO_SLIDE_MS);
}
function heroArmFail(token){
  clearTimeout(heroYT.failTimer);
  heroYT.failTimer=setTimeout(()=>{ if(token===heroState.token && heroActive()) heroNextSlide(); },9000);
}
function heroKick(){
  if(!heroActive()) return;
  const item=heroState.items[heroState.index]; if(!item) return;
  const token=heroState.token;
  if(item._ytKey && heroYT.player && heroYT.ready){
    try{ heroYT.player.playVideo(); if(heroYT.unlocked) heroYT.player.unMute(); }catch(e){}
    heroArmFail(token);
  } else if(!item._ytKey){ heroArmImg(token); }
}
function heroNextSlide(){
  if(!document.getElementById('home-hero')){ heroTeardown(); return; }
  heroState.index=(heroState.index+1)%heroState.items.length;
  renderHeroSlide();
}
function heroTeardown(){ heroDestroyPlayer(); try{ if(heroYT.io) heroYT.io.disconnect(); }catch(e){} heroYT.io=null; }
async function heroPlayTrailer(item,token){
  const box=document.getElementById('hero-video');
  if(!box||!item._ytKey) return;
  await loadYTApi();
  if(token!==heroState.token || !document.getElementById('hero-video')) return;
  if(heroYT.player && heroYT.ready){
    try{
      if(heroActive()) heroYT.player.loadVideoById({videoId:item._ytKey,startSeconds:HERO_START});
      else heroYT.player.cueVideoById({videoId:item._ytKey,startSeconds:HERO_START});
    }catch(e){}
    if(heroActive()) heroArmFail(token);
    return;
  }
  if(heroYT.player) return;  // creation en cours : onReady chargera le film courant
  const q=new URLSearchParams({enablejsapi:1,autoplay:1,mute:1,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0,iv_load_policy:3,playsinline:1,cc_load_policy:0,start:HERO_START});
  if(/^https?:$/.test(location.protocol)) q.set('origin',location.origin);
  const fr=document.createElement('iframe');
  fr.id='hero-yt'; fr.src='https://www.youtube.com/embed/'+item._ytKey+'?'+q.toString();
  fr.allow='autoplay; encrypted-media; picture-in-picture'; fr.setAttribute('referrerpolicy','strict-origin-when-cross-origin'); fr.setAttribute('frameborder','0');
  box.innerHTML=''; box.appendChild(fr);
  heroYT.player=new YT.Player(fr,{
    events:{
      onReady:(e)=>{
        heroYT.ready=true; heroFitVideo();
        const f=box.querySelector('iframe'); if(f){ f.setAttribute('tabindex','-1'); f.setAttribute('aria-hidden','true'); }
        const cur=heroState.items[heroState.index];
        try{
          if(heroYT.unlocked) e.target.unMute(); else e.target.mute();
          if(cur&&cur._ytKey){
            if(heroActive()){ e.target.loadVideoById({videoId:cur._ytKey,startSeconds:HERO_START}); heroArmFail(heroState.token); }
            else e.target.cueVideoById({videoId:cur._ytKey,startSeconds:HERO_START});
          }
        }catch(_){}
      },
      onStateChange:(e)=>{
        const vb=document.getElementById('hero-video');
        if(e.data===1){
          if(!heroActive()){ try{ e.target.pauseVideo(); }catch(_){} return; }
          if(vb) vb.classList.add('on');
          clearTimeout(heroYT.failTimer); clearTimeout(heroYT.slideTimer);
          heroYT.slideTimer=setTimeout(()=>{ if(heroActive()) heroNextSlide(); },HERO_SLIDE_MS);
        } else if(e.data===2){
          clearTimeout(heroYT.slideTimer);
          if(heroActive()){ try{ e.target.playVideo(); }catch(_){} }   // pause interdite
        } else if(e.data===0){
          if(heroActive()) heroNextSlide();
        }
      },
      onError:(e)=>{ console.warn('Bubux hero YouTube error',e&&e.data); if(heroActive()) heroNextSlide(); }
    }
  });
  heroFitVideo();
}
// Premier doigt pose sur l'ecran = autorisation navigateur : on passe la video avec le son
(function(){
  function unlock(){
    heroYT.unlocked=true;
    if(heroYT.player && heroYT.ready && heroActive()){
      try{
        const cur=heroState.items[heroState.index];
        const st=heroYT.player.getPlayerState?heroYT.player.getPlayerState():-1;
        if(st!==1 && cur && cur._ytKey) heroYT.player.loadVideoById({videoId:cur._ytKey,startSeconds:HERO_START});
        else heroYT.player.playVideo();
        heroYT.player.unMute(); heroYT.player.setVolume(100);
      }catch(e){}
    }
  }
  window.addEventListener('pointerdown',unlock,{passive:true,capture:true});
  window.addEventListener('touchstart',unlock,{passive:true,capture:true});
  window.addEventListener('mousedown',unlock,{passive:true,capture:true});
  window.addEventListener('keydown',unlock,{passive:true,capture:true});
  window.addEventListener('resize',heroFitVideo);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) heroStopPlayback(); else heroKick(); });
})();

async function loadCatalogMore(reset){
  if(catalogState.loading) return;
  catalogState.loading=true;
  const grid=document.getElementById('catalog-grid');
  if(!grid){ catalogState.loading=false; return; }
  if(reset){ grid.innerHTML=Array.from({length:8}).map(()=>'<div class="card"><div class="skel skel-card"></div></div>').join(''); catalogState.page=0; catalogState.known=false; }
  const nextPage=catalogState.page+1;
  const params={page:nextPage, sort_by:catalogState.filters.sort, include_adult:false};
  if(catalogState.filters.genre) params.with_genres=catalogState.filters.genre;
  if(catalogState.filters.year) params[catalogState.mediaType==='movie'?'primary_release_year':'first_air_date_year']=catalogState.filters.year;
  if(catalogState.filters.provider){ params.with_watch_providers=catalogState.filters.provider; params.watch_region=STATE.region; }
  try{
    const tot=catalogState.known?Math.max(1,catalogState.totalPages):0;
    const pn=i=>tot?(((nextPage-1+i)%tot)+1):(nextPage+i);
    const datas=await Promise.all([0,1,2].map(i=>TMDBApi.discover(catalogState.mediaType,Object.assign({},params,{page:pn(i)})).catch(()=>null)));
    const okd=datas.filter(Boolean); if(!okd.length) throw new Error('TMDB_ERROR');
    const last=okd[okd.length-1];
    catalogState.page=nextPage+2; catalogState.totalPages=Math.min(last.total_pages||1,500); catalogState.known=true;
    const seenC=new Set(); let html='';
    okd.forEach(dd=>(dd.results||[]).forEach(it=>{ if(seenC.has(it.id)) return; seenC.add(it.id); html+=posterCardHtml(it); }));
    if(reset) grid.innerHTML=html || `<p style="grid-column:1/-1;color:var(--text-3);padding:20px 0">${t('noResultsFilters')}</p>`;
    else grid.insertAdjacentHTML('beforeend',html);
  }catch(e){ handleApiError(e); if(reset) grid.innerHTML=''; }
  catalogState.loading=false;
}
async function openFilterSheet(kind){
  let title,options;
  if(kind==='genre'){
    const list=await ensureGenres(catalogState.mediaType);
    title=t('genre'); options=[{value:'',label:t('allGenres')}].concat(list.map(g=>({value:String(g.id),label:g.name})));
  } else if(kind==='year'){
    title=t('year'); const now=new Date().getFullYear();
    options=[{value:'',label:t('allYears')}].concat(Array.from({length:now-1949},(_,i)=>({value:String(now-i),label:String(now-i)})));
  } else if(kind==='sort'){
    title=t('sortBy');
    options=[
      {value:'popularity.desc',label:t('popular')},
      {value:'vote_average.desc',label:t('topRated')},
      {value:catalogState.mediaType==='movie'?'primary_release_date.desc':'first_air_date.desc',label:t('newest')},
      {value:catalogState.mediaType==='movie'?'primary_release_date.asc':'first_air_date.asc',label:t('oldest')},
    ];
  } else if(kind==='provider'){
    title=t('provider');
    try{
      const data=await TMDBApi.providersList(catalogState.mediaType, STATE.region);
      const list=(data.results||[]).slice().sort((a,b)=>(a.display_priority||99)-(b.display_priority||99));
      options=[{value:'',label:t('allProviders')}].concat(list.map(p=>({value:String(p.provider_id),label:p.provider_name})));
    }catch(e){ options=[{value:'',label:t('allProviders')}]; }
  }
  openModal(`<h3>${title}</h3><div class="modal-field" style="max-height:52vh;overflow-y:auto">
    ${options.map(o=>`<button class="list-picker-item" data-action="apply-filter" data-kind="${kind}" data-value="${o.value}" data-label="${escapeHtml(o.label)}" style="width:100%;text-align:left">${escapeHtml(o.label)}</button>`).join('')}
  </div>`);
}
function applyFilterValue(kind,value,label){
  if(kind==='sort') catalogState.filters.sort=value; else catalogState.filters[kind]=value||null;
  if(kind==='provider'){
    STATE.selectedProvider=value?{id:value,name:label}:null;
    saveState();
  }
  const pill=document.getElementById('filter-pill-'+kind);
  if(pill){
    const svgHtml=pill.querySelector('svg').outerHTML;
    if(kind==='sort') pill.innerHTML=`<span class="dot-active"></span>${escapeHtml(label)} `+svgHtml;
    else { const dflt={genre:t('allGenres'),year:t('allYears'),provider:t('allProviders')}[kind]; pill.innerHTML=`${escapeHtml(value?label:dflt)} `+svgHtml; }
  }
  closeModal();
  loadCatalogMore(true);
}

let searchState={query:''};
let searchDebounce=null;
let searchPage={page:1,totalPages:1};
async function renderSearch(root){
  root.innerHTML=`<div class="page">
      <button class="back-btn" data-action="go-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

      </div>
      <div id="search-results-wrap"></div>
    </div>`;
  const input=document.getElementById('search-input');
  input.addEventListener('input', onSearchInput);
  if(searchState.query) runSearch(searchState.query); else loadTrendingToday();
}
function onSearchInput(e){
  searchState.query=e.target.value;
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>{ const q=searchState.query.trim(); q?runSearch(q):loadTrendingToday(); },350);
}
async function loadTrendingToday(){
  const wrap=document.getElementById('search-results-wrap');
  if(!wrap) return;
  window.__infiniteScrollHandler=null;
  wrap.innerHTML=`<p class="trending-label">${t('trendingToday')}</p><div class="grid-2col">${skeletonRow(8)}</div>`;
  try{
    const data=await TMDBApi.trending('all','day');
    const g=wrap.querySelector('.grid-2col'); if(g) g.innerHTML=(data.results||[]).map(posterCardHtml).join('');
    let tp=data.page, tt=Math.min(data.total_pages||1,500), tl=false;
    window.__infiniteScrollHandler=async()=>{
      if(tl) return; if(tp>=tt) tp=0; tl=true;
      try{ const d2=await TMDBApi.trending('all','day',tp+1); tp=d2.page;
        const g2=wrap.querySelector('.grid-2col'); if(g2) g2.insertAdjacentHTML('beforeend',(d2.results||[]).filter(r=>r.media_type!=='person').map(posterCardHtml).join('')); }catch(e){}
      tl=false;
    };
  }catch(e){ handleApiError(e); }
}
async function runSearch(q){
  const wrap=document.getElementById('search-results-wrap');
  if(!wrap) return;
  wrap.innerHTML=`<div class="grid-2col">${skeletonRow(8)}</div>`;
  window.__infiniteScrollHandler=null;
  try{
    const data=await TMDBApi.searchMulti(q,1);
    searchPage={page:data.page,totalPages:data.total_pages};
    const results=(data.results||[]).filter(r=>r.media_type==='movie'||r.media_type==='tv');
    const g=wrap.querySelector('.grid-2col');
    if(g) g.innerHTML=results.map(posterCardHtml).join('') || `<p style="grid-column:1/-1;color:var(--text-3)">${t('noResultsFor',escapeHtml(q))}</p>`;
    window.__infiniteScrollHandler=async ()=>{
      if(searchPage.page>=searchPage.totalPages) return;
      try{
        const d2=await TMDBApi.searchMulti(q, searchPage.page+1);
        searchPage.page=d2.page;
        const more=(d2.results||[]).filter(r=>r.media_type==='movie'||r.media_type==='tv').map(posterCardHtml).join('');
        const g2=wrap.querySelector('.grid-2col'); if(g2) g2.insertAdjacentHTML('beforeend',more);
      }catch(e){}
    };
  }catch(e){ handleApiError(e); }
}

async function toggleListItem(listId,mediaType,id){
  const list=STATE.lists.find(l=>l.id===listId); if(!list) return;
  const idx=list.items.findIndex(it=>String(it.id)===String(id) && it.media_type===mediaType);
  if(idx>-1){ list.items.splice(idx,1); saveState(); showToast(t('removedFrom',list.name)); }
  else{
    showToast(t('adding'));
    try{
      const details=await tmdb(`/${mediaType}/${id}`);
      list.items.unshift({id:Number(id), media_type:mediaType, title:details.title||details.name, poster_path:details.poster_path||null, vote_average:details.vote_average, release_date:details.release_date, first_air_date:details.first_air_date});

let videasySandboxEnabled=false; // activé par défaut pour protéger des pubs, désactivable par l'utilisateur
function videasyDetectDefaultLang(){
  // Détecte la langue du navigateur/appareil de l'utilisateur, plutôt que de
  // forcer le français pour tout le monde. Langues confirmées par la doc
  // nxsha.space (codes ISO 639-1) : en, es, hi, fr. Repli sur 'fr' si aucune
  // des langues du navigateur ne correspond.
  const supported=['fr','en','es','hi'];
  const langs=(navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
  for(const l of langs){
    const code=(l||'').toLowerCase().slice(0,2);
    if(supported.includes(code)) return code;
  }
  return 'fr';
}
let videasyAudioLang=(localStorage.getItem('videasyAudioLang')||videasyDetectDefaultLang()); // code ISO 639-1 ('fr','en','es','hi'), détecté automatiquement puis mémorisé
const VIDEASY_SANDBOX_VALUE='allow-scripts allow-same-origin allow-forms allow-presentation allow-orientation-lock allow-storage-access-by-user-activation';

function videasyApplySandboxAttribute(iframe){
  if(videasySandboxEnabled) iframe.setAttribute('sandbox', VIDEASY_SANDBOX_VALUE);
  else iframe.removeAttribute('sandbox');
}

function videasyBuildUrl(mediaType,tmdbId,season,episode){
  // Paramètres conformes à la doc officielle nxsha.space/embed :
  // ?lang=xx (piste audio) et ?sub=xx (sous-titres), codes ISO 639-1.
  // Lecteur Fluxora : langue 'vf' si l'utilisateur est en francais, sinon 'vo'.
  const flxLang=(videasyAudioLang==='fr')?'vf':'vo';
  const base=`https://fluxora.sbs/embed/zenix?tmdb=${tmdbId}&type=${mediaType}&lang=${flxLang}&embed_mobile=1&pk=6O5dLJWmhoxPjmKdXWAtNlBRjxtv1O`;
  if(mediaType==='movie') return base;
  if(mediaType==='tv'){
    const s=season||1, e=episode||1;
    return `${base}&season=${s}&episode=${e}`;
  }
  return null;
}

window.addEventListener('message', function(event){
  if(!event.origin.includes('autoembed') && !event.origin.includes('nxsha.space')) return;
  try{

    if(!data) return;
    if(data.id && data.type && typeof data.progress==='number') videasyLastKnownProgressPct=Math.round(data.progress);
  }catch(e){ /* message non JSON ou format inattendu, on ignore sans bloquer */ }
});

/* Enregistre la progression réelle (saison/épisode réellement choisis par
   l'utilisateur, pas de valeur aléatoire ni inventée) dans "Reprendre la lecture". */
function logRealProgress(){
  if(!videasyCurrentTmdbId || !videasyCurrentMediaType) return;
  if(!STATE.continueWatching) STATE.continueWatching=[];

  const mediaType=videasyCurrentMediaType;
  const id=videasyCurrentTmdbId;
  const existingIndex=STATE.continueWatching.findIndex(
    item=>String(item.id)===String(id) && item.media_type===mediaType
  );

  let progressLabel;
  if(mediaType==='tv'){
    progressLabel=`S${videasyCurrentSeason||1} E${videasyCurrentEpisode||1} en cours`;
  }else{
    progressLabel='Reprendre la lecture';
  }

  const newItem={
    id:Number(id), media_type:mediaType,
    title:videasyCurrentTitle||'Titre inconnu', image:videasyCurrentImage||'',
    progressLabel, updatedAt:Date.now(),
    season:videasyCurrentSeason, episode:videasyCurrentEpisode
  };

  const finish=(item)=>{
    if(existingIndex>-1) STATE.continueWatching.splice(existingIndex,1);
    STATE.continueWatching.unshift(item);
    if(STATE.continueWatching.length>10) STATE.continueWatching=STATE.continueWatching.slice(0,10);
    saveState();
    if(parseHash()[0]==='home') renderContinueWatching();
  };

  if(!newItem.title || newItem.title==='Titre inconnu' || !newItem.image){
    fetchVideasyTitleDetails(mediaType,id).then(details=>{
      newItem.title=details.title;
      newItem.image=details.poster_path;
      videasyCurrentTitle=details.title;
      videasyCurrentImage=details.poster_path;
      finish(newItem);
    });
  }else{
    finish(newItem);
  }
}
async function fetchVideasyTitleDetails(mediaType,id){
  try{
    const res=await tmdb(`/${mediaType}/${id}`);
    return{ title:res.title||res.name||'Titre inconnu', poster_path:res.backdrop_path||res.poster_path||'' };
  }catch(e){
    return{ title:'Titre inconnu', poster_path:'' };
  }
}

function videasyScheduleNextEpisodeSuggestion(){

function videasyGoToNextEpisode(){
  if(!videasySeasonsCache || videasyCurrentMediaType!=='tv') return;
  const episodes=videasySeasonsCache.episodesBySeason[videasyCurrentSeason]||[];
  const hasNextInSeason=episodes.some(ep=>ep.episode_number===videasyCurrentEpisode+1);
  if(hasNextInSeason){
    videasySwitchEpisode(videasyCurrentSeason,videasyCurrentEpisode+1);
  }else{
    const nextSeason=videasySeasonsCache.seasons.find(s=>s.season_number===videasyCurrentSeason+1);
    if(nextSeason) videasySwitchEpisode(nextSeason.season_number,1);

/* ================= BLOCAGE DES REDIRECTIONS PUBLICITAIRES =================
   Le lecteur Videasy (iframe tierce, non-sandboxée pour qu'il fonctionne) peut
   contenir des scripts publicitaires qui tentent de rediriger l'utilisateur en
   dehors de Bubux. On bloque uniquement les tentatives de redirection vers un
   AUTRE site que le nôtre — jamais la navigation interne à Bubux (changement
   de hash, rechargement, etc.), qui doit continuer à fonctionner normalement. */
function videasyIsOpen(){
  const modal=document.getElementById('videasy-modal');
  return !!(modal && modal.style.display==='flex');
}
function isSameOriginUrl(url){
  try{
    const resolved=new URL(url, location.href);
    return resolved.origin===location.origin;
  }catch(e){
    // Une URL relative ou un simple hash (#/home) est toujours interne.
    return true;
  }
}

// Lien de monetisation (Smartlink Adsterra). Colle ton lien entre les guillemets.
const AD_LINK='https://directyp.org/4/4b66e28a51cca569f4ae5bc1bb0e00b6';
function openExternalTab(url){
  if(!url) return;
  const desktop=window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!desktop){ window.open(url,'_blank','noopener'); return; }
  const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.style.display='none';
  document.body.appendChild(a);
  const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
  a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window,ctrlKey:!isMac,metaKey:isMac}));
  setTimeout(function(){ a.remove(); },0);
}
// 0) Ordinateur uniquement (souris) : les liens externes de Bubux (plateformes
// "Disponible sur") s'ouvrent dans l'onglet voisin, sans basculer dessus.
// Sur telephone/tablette (ecran tactile) rien ne change.
document.addEventListener('click', function(e){
  if(!e.isTrusted || e.defaultPrevented) return;
  if(e.button!==0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  if(!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const link=e.target.closest && e.target.closest('a.provider-badge[target="_blank"]');
  if(!link) return;
  e.preventDefault();
  const a=document.createElement('a');
  a.href=link.href; a.target='_blank'; a.rel='noopener'; a.style.display='none';
  document.body.appendChild(a);
  const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
  a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window,ctrlKey:!isMac,metaKey:isMac}));
  setTimeout(function(){ a.remove(); },0);
}, true);

// 1) Bloque toute ouverture de nouvel onglet/fenêtre vers un site externe
// (la méthode la plus utilisée par les régies pub pour rediriger).
(function blockWindowOpen(){
  const nativeOpen=window.open;
  window.open=function(url){
    if(videasyIsOpen() && url && !isSameOriginUrl(url)) return null;
    return nativeOpen.apply(window, arguments);
  };
})();

// 2) Bloque les clics sur des liens menant vers un domaine externe
// injectés dynamiquement dans la page, sans toucher aux liens internes.
document.addEventListener('click', function(e){
  if(!videasyIsOpen()) return;
  const link=e.target.closest && e.target.closest('a[href]');
  if(!link) return;
  const href=link.getAttribute('href')||'';
  if(href.startsWith('#')) return; // navigation interne Bubux, toujours autorisée
  if(!isSameOriginUrl(href)){
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// 3) Empêche une redirection de toute la page vers un domaine externe
// (location.href/assign/replace), en laissant passer toute navigation interne.
(function blockTopNavigation(){
  const nativeAssign=window.location.assign.bind(window.location);
  const nativeReplace=window.location.replace.bind(window.location);
  try{
    window.location.assign=function(url){
      if(videasyIsOpen() && !isSameOriginUrl(url)) return;
      return nativeAssign(url);
    };
    window.location.replace=function(url){
      if(videasyIsOpen() && !isSameOriginUrl(url)) return;
      return nativeReplace(url);
    };
  }catch(e){ /* certains navigateurs interdisent de réécrire location, on ignore */ }
})();

// 4) Filet de sécurité : une simple assignation `location.href = "..."` ne peut
// pas toujours être interceptée directement, donc on bloque le déchargement de
// la page au dernier moment si le lecteur est ouvert (l'utilisateur doit fermer
// le lecteur ou confirmer explicitement pour quitter Bubux).
window.addEventListener('beforeunload', function(e){
  if(videasyIsOpen()){
    e.preventDefault();
    e.returnValue='';
  }
});

/* ================= SHORTS ================= */
let shortsObserver=null;
let shortsMuted=true;
let shortsVideoCache={};
function muteIconSvg(muted){
  return muted
    ? '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9Z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9Z"/><path d="M16.2 8.8a5 5 0 0 1 0 6.4"/><path d="M19 6.2a8.5 8.5 0 0 1 0 11.6"/></svg>';
}
async function renderShorts(root){
  root.innerHTML=`<div class="page shorts-page">
      <button class="back-btn shorts-back-btn" data-action="go-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="shorts-wrap" id="shorts-wrap"></div>
    </div>`;
  const wrap=document.getElementById('shorts-wrap');
  wrap.innerHTML=Array.from({length:5}).map(()=>'<div class="short-item"><div class="skel" style="position:absolute;inset:0"></div></div>').join('');
  try{
    const data=await TMDBApi.trending('all','week');
    const items=(data.results||[]).filter(it=>it.backdrop_path && (it.media_type==='movie'||it.media_type==='tv')).slice(0,10);
    wrap.innerHTML=items.map(it=>{
      const mt=it.media_type;
      return `<div class="short-item" data-type="${mt}" data-id="${it.id}" data-active="0">
        <div class="short-bg" style="background-image:url(${IMG_BASE}/${BACKDROP_SIZE}${it.backdrop_path})"></div>
        <div class="short-scrim"></div>
        <div class="short-video-slot"></div>
        <button class="short-mute-btn" data-action="toggle-short-mute" aria-label="Mute">${muteIconSvg(shortsMuted)}</button>
        <div class="short-content"><h3>${escapeHtml(it.title||it.name)}</h3>
          <div class="hero-meta"><span>${iconSpan(STAR_PATH).replace('<svg ','<svg class="star-ic" ')}${it.vote_average?it.vote_average.toFixed(1):'–'}/10</span></div>
        </div></div>`;
    }).join('') || `<div class="short-item"><div class="short-content"><h3>${t('noTrendingShorts')}</h3></div></div>`;
    setupShortsObserver();
  }catch(e){ handleApiError(e); }
}
function setupShortsObserver(){
  const wrap=document.getElementById('shorts-wrap');
  if(!wrap) return;
  if(shortsObserver) shortsObserver.disconnect();
  shortsObserver=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio>=0.6) activateShort(entry.target);
      else deactivateShort(entry.target);
    });
  }, {root:wrap, threshold:[0,0.6,1]});
  wrap.querySelectorAll('.short-item[data-type]').forEach(item=>shortsObserver.observe(item));
}
async function activateShort(item){
  if(item.dataset.active==='1') return;
  item.dataset.active='1';
  const slot=item.querySelector('.short-video-slot');
  const type=item.dataset.type, id=item.dataset.id;
  const cacheKey=type+'-'+id;
  let key=shortsVideoCache[cacheKey];
  if(key===undefined){
    try{
      const langParam=LANG_TO_TMDB[CURRENT_LANG]||'en-US';
      let data=await tmdb(`/${type}/${id}/videos`,{language:langParam});
      let vids=data.results||[];
      let trailer=vids.find(v=>v.site==='YouTube'&&v.type==='Trailer');
      if(!trailer && langParam!=='en-US'){
        data=await tmdb(`/${type}/${id}/videos`,{language:'en-US'});
        vids=data.results||[];
        trailer=vids.find(v=>v.site==='YouTube'&&v.type==='Trailer')||vids.find(v=>v.site==='YouTube');
      }
      key=trailer?trailer.key:null;
    }catch(e){ key=null; }
    shortsVideoCache[cacheKey]=key;
  }
  if(item.dataset.active!=='1' || !slot) return;
  if(key){
    const m=shortsMuted?1:0;
    slot.innerHTML=`<iframe src="https://www.youtube.com/embed/${key}?autoplay=1&mute=${m}&playsinline=1&controls=0&loop=1&playlist=${key}&modestbranding=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }
}
function deactivateShort(item){
  item.dataset.active='0';
  const slot=item.querySelector('.short-video-slot');
  if(slot) slot.innerHTML='';
}
function toggleShortsMute(btnEl){
  shortsMuted=!shortsMuted;
  document.querySelectorAll('.short-mute-btn').forEach(b=>b.innerHTML=muteIconSvg(shortsMuted));
  const activeItem=document.querySelector('.short-item[data-active="1"]');
  if(activeItem){ activeItem.dataset.active='0'; activateShort(activeItem); }
}
